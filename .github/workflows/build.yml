
name: Build VANTA Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract VANTA
        run: |
          unzip -q VANTA_Client_1.21.4_v0.1.0.zip -d .

      - name: Build VANTA
        run: gradle -p VANTA_1_21_4 build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Client
          path: VANTA_1_21_4/build/libs/*.jar
